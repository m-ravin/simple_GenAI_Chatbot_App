[project]
name = "simple-genai-chatbot-app"
version = "0.1.0"
description = "A comprehensive repository demonstrating how to build GenAI-powered chatbot applications using LangChain, OpenAI, Ollama, and Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "faiss-cpu>=1.12.0",
    "fastapi>=0.120.1",
    "langchain>=1.0.3",
    "langchain-chroma>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.2",
    "langchain-groq>=1.0.0",
    "langchain-huggingface>=1.0.0",
    "langchain-openai>=1.0.1",
    "langserve>=0.3.3",
    "openai>=2.6.1",
    "pypdf>=6.2.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.1.2",
    "sse-starlette>=3.0.2",
    "streamlit>=1.50.0",
    "uvicorn>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
python-version = "3.12"
